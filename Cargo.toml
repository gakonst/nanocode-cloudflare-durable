[package]
name = "nanocode-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
autotests = false
autobenches = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false
bench = false

[dependencies]
nanocode = { path = "../nanocodex/crates/nanocode" }

[target.'cfg(target_family = "wasm")'.dependencies]
nanocode-code-mode = { path = "../nanocodex/crates/runtime/code-mode" }
blake3 = { version = "1.8.7", default-features = false, features = ["wasm32_simd"] }
futures-channel = "0.3.31"
futures-executor = "0.3.31"
futures-util = "0.3.31"
http = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.dev]
debug = false
incremental = true

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
